[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboard"
version = "1.4.4"
description = "On-screen keyboard for Linux desktops"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "Onboard contributors"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Accessibility",
]

[project.urls]
Homepage = "https://github.com/Alaa91H/onboard"
Source = "https://github.com/Alaa91H/onboard"

[tool.setuptools]
include-package-data = false
zip-safe = false
