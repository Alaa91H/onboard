name: Linux release candidate

on:
  workflow_call:
    inputs:
      version:
        description: Optional version guard; must equal the version declared by setup.py.
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Read declared package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' pyproject.toml)"
          test -n "$version"
          requested="${{ inputs.version }}"
          if [[ -n "$requested" && "$requested" != "$version" ]]; then
            echo "Requested version '$requested' does not match package version '$version'." >&2
            exit 2
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  linux-release-candidate:
    name: Linux release candidate (${{ matrix.arch }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify release candidate
        run: >-
          python3 tools/build.py candidate linux
          --arch ${{ matrix.arch }} --version ${{ needs.resolve-version.outputs.version }}
      - name: Verify manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          candidate="release-out/linux-${{ matrix.arch }}"
          sha256sum -c "$candidate/SHA256SUMS"
          python3 ci/scripts/verify_release_candidate.py \
            --directory "$candidate" \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --target-os linux \
            --target-arch "${{ matrix.arch }}"
      - name: Upload verified candidate
        uses: actions/upload-artifact@v6
        with:
          name: onboard-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}
          path: release-out/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

# This workflow creates verified, downloadable Linux candidate artifacts only.
# A future stable-release workflow must require the protected stable-release
# environment, target-native smoke tests, Windows Authenticode signing, and
# macOS codesigning plus notarization before it creates a public release.
