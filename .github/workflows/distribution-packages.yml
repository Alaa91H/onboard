name: Distribution package candidates

on:
  pull_request:
    paths:
      - 'debian/**'
      - 'packaging/**'
      - 'tools/build.py'
      - 'ci/scripts/verify_release_candidate.py'
      - 'ci/scripts/write_*.py'
      - '.github/workflows/distribution-packages.yml'
      - 'Onboard/**'
      - 'native/**'
      - 'po/**'
      - 'i18n/**'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
  push:
    branches: [main]
    paths:
      - 'debian/**'
      - 'packaging/**'
      - 'ci/scripts/**'
      - 'tools/build.py'
      - '.github/workflows/distribution-packages.yml'
      - 'Onboard/**'
      - 'native/**'
      - 'po/**'
      - 'i18n/**'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install Debian packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./tools/prepare-build-env.sh --with-tests
          sudo apt-get install -y \
            debhelper dh-python devscripts fakeroot \
            python3-distutils-extra python3-packaging
      - name: Build and verify Debian candidate
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' pyproject.toml)"
          python3 tools/build.py candidate debian --arch '${{ matrix.arch }}' --version "$version"
          candidate="release-out/debian-${{ matrix.arch }}"
          sha256sum -c "$candidate/SHA256SUMS"
          python3 ci/scripts/verify_release_candidate.py \
            --directory "$candidate" --version "$version" \
            --target-os linux-debian --target-arch '${{ matrix.arch }}'
      - name: Upload verified Debian candidate
        uses: actions/upload-artifact@v6
        with:
          name: onboard-debian-${{ matrix.arch }}-candidate
          path: release-out/debian-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  rpm:
    name: Fedora RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install RPM packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./tools/prepare-build-env.sh --with-tests
          dnf install -y rpm-build rpmdevtools pyproject-rpm-macros
      - name: Build and verify RPM candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' pyproject.toml)"
          python3 tools/build.py candidate rpm --arch '${{ matrix.arch }}' --version "$version"
          candidate="release-out/rpm-${{ matrix.arch }}"
          sha256sum -c "$candidate/SHA256SUMS"
          python3 ci/scripts/verify_release_candidate.py \
            --directory "$candidate" --version "$version" \
            --target-os linux-rpm --target-arch '${{ matrix.arch }}'
      - name: Upload verified RPM candidate
        uses: actions/upload-artifact@v6
        with:
          name: onboard-rpm-${{ matrix.arch }}-candidate
          path: release-out/rpm-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  arch-x64:
    name: Arch package (x64)
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - uses: actions/checkout@v5
      - name: Initialize Arch packaging prerequisites
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --needed --noconfirm base-devel
          ./tools/prepare-build-env.sh --with-tests
      - name: Build and verify Arch candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' pyproject.toml)"
          python3 tools/build.py candidate arch --arch x64 --version "$version"
          candidate="release-out/arch-x64"
          sha256sum -c "$candidate/SHA256SUMS"
          python3 ci/scripts/verify_release_candidate.py \
            --directory "$candidate" --version "$version" \
            --target-os linux-arch --target-arch x64
      - name: Upload verified Arch candidate
        uses: actions/upload-artifact@v6
        with:
          name: onboard-arch-x64-candidate
          path: release-out/arch-x64/
          if-no-files-found: error
          retention-days: 30

  arch-arm64:
    name: Arch package (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Build Arch Linux ARM candidate in native container
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' pyproject.toml)"
          docker run --rm \
            --env ONBOARD_VERSION="$version" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            agners/archlinuxarm \
            /bin/sh -lc '
              set -eu
              sed -i "/^\\[options\\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --needed --noconfirm base-devel grep
              ./tools/prepare-build-env.sh --with-tests
              export CC=gcc CXX=g++
              python3 tools/build.py candidate arch \
                --arch arm64 --version "$ONBOARD_VERSION"
            '
          candidate="release-out/arch-arm64"
          sha256sum -c "$candidate/SHA256SUMS"
          python3 ci/scripts/verify_release_candidate.py \
            --directory "$candidate" --version "$version" \
            --target-os linux-arch --target-arch arm64
      - name: Upload verified Arch Linux ARM candidate
        uses: actions/upload-artifact@v6
        with:
          name: onboard-arch-arm64-candidate
          path: release-out/arch-arm64/
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install Flatpak builder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Build and verify Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^[[:space:]]*version[[:space:]]*=/ {print $2; exit}' pyproject.toml)"
          python3 tools/build.py candidate flatpak --arch '${{ matrix.arch }}' --version "$version"
          candidate="release-out/flatpak-${{ matrix.arch }}"
          sha256sum -c "$candidate/SHA256SUMS"
          python3 ci/scripts/verify_release_candidate.py \
            --directory "$candidate" --version "$version" \
            --target-os linux-flatpak --target-arch '${{ matrix.arch }}'
      - name: Upload verified Flatpak bundle
        uses: actions/upload-artifact@v6
        with:
          name: onboard-flatpak-${{ matrix.arch }}-candidate
          path: release-out/flatpak-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

# Candidate-only workflow. No job signs, publishes, or creates a public release.
