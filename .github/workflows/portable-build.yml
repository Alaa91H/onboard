name: Portable build

on:
  push:
    branches: [main, master, feat/input-source-switching]
  pull_request:

jobs:
  linux-ubuntu:
    name: Ubuntu (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Record native target
        run: |
          echo "runner=${{ runner.os }}"
          uname -a
          python3 --version
          rustc --version || true
      - name: Install build dependencies
        run: ./tools/prepare-build-env.sh --with-tests
      - name: Build and verify portable artifacts
        run: python3 tools/build.py portable
      - name: Upload Linux distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: onboard-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  linux-fedora:
    name: Fedora (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Record host target
        run: uname -a
      - name: Install build dependencies
        run: ./tools/prepare-build-env.sh --with-tests
      - name: Record native toolchain
        run: |
          python3 --version
          rustc --version
          cargo --version
      - name: Build and verify portable artifacts
        run: python3 tools/build.py portable
      - name: Upload Linux distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: onboard-fedora-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  arch-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate package recipe contracts
        run: python3 tools/build.py validate-recipes
