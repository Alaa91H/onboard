name: Portable build

on:
  push:
    branches: [main, master, feat/input-source-switching]
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: ./tools/prepare-build-env.sh --with-tests
      - name: Build source extensions
        run: python3 setup.py build
      - name: Verify focused regressions
        run: >-
          xvfb-run -a python3 -m unittest
          Onboard.test.test_WaylandCapabilities
          Onboard.test.test_ClipboardHistory
          Onboard.test.test_InputSources
          Onboard.test.test_LayoutLoaderSVG
          Onboard.test.test_QuickAccess
          Onboard.test.test_ArabicLocalization
          Onboard.test.test_NativeInput
          Onboard.test.test_RTL
      - name: Verify Rust native crate
        run: cargo test --manifest-path native/onboard-native/Cargo.toml --locked
      - name: Verify Arabic catalog
        run: python3 i18n/scripts/check_catalog.py po/ar.po --language ar --require-complete
      - name: Build PEP 517 distributions
        run: python3 -m build --no-isolation

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: ./tools/prepare-build-env.sh --with-tests
      - name: Build source extensions
        run: python3 setup.py build
      - name: Verify focused regressions
        run: >-
          xvfb-run -a python3 -m unittest
          Onboard.test.test_WaylandCapabilities
          Onboard.test.test_ClipboardHistory
          Onboard.test.test_InputSources
          Onboard.test.test_LayoutLoaderSVG
          Onboard.test.test_QuickAccess
          Onboard.test.test_ArabicLocalization
          Onboard.test.test_NativeInput
          Onboard.test.test_RTL
      - name: Verify Rust native crate
        run: cargo test --manifest-path native/onboard-native/Cargo.toml --locked
      - name: Verify Arabic catalog
        run: python3 i18n/scripts/check_catalog.py po/ar.po --language ar --require-complete
      - name: Build PEP 517 distributions
        run: python3 -m build --no-isolation

  arch-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Arch package recipe syntax
        run: bash -n packaging/arch/PKGBUILD
      - name: Validate Flatpak manifest essentials
        run: |
          grep -q '^id: org.onboard.Onboard$' packaging/flatpak/org.onboard.Onboard.yml
          grep -q '^runtime: org.gnome.Platform$' packaging/flatpak/org.onboard.Onboard.yml
          grep -q '^command: onboard$' packaging/flatpak/org.onboard.Onboard.yml
          grep -q 'org.freedesktop.Sdk.Extension.rust-stable' packaging/flatpak/org.onboard.Onboard.yml
          test -f native/onboard-native/Cargo.lock
          test -f native/onboard-native/.cargo/config.toml
