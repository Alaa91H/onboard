name: Build Packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debian:
    name: Build Debian/Ubuntu Packages
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y git build-essential python3-packaging python3-dev
        apt-get install -y dh-python python3-distutils-extra devscripts pkg-config
        apt-get install -y libgtk-3-dev libxtst-dev libxkbfile-dev libdconf-dev libcanberra-dev
        apt-get install -y libhunspell-dev libudev-dev python3-gi-cairo
        apt-get install -y debhelper dpkg-dev
    
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Build packages
      run: /bin/sh ./build_debs.sh
    
    - name: Upload Debian packages
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages
        path: build/debs/*.deb
        retention-days: 30

  build-fedora:
    name: Build Fedora RPM Packages
    runs-on: ubuntu-latest
    container: fedora:latest
    
    steps:
    - name: Install dependencies
      run: |
        dnf install -y git gcc-c++ python3-devel python3-setuptools
        dnf install -y python3-packaging python3-distutils-extra
        dnf install -y gtk3-devel libXtst-devel libxkbfile-devel dconf-devel
        dnf install -y libcanberra-devel hunspell-devel libudev-devel
        dnf install -y rpm-build intltool pkg-config
    
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Build RPM
      run: |
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        cp packaging/fedora/onboard.spec ~/rpmbuild/SPECS/
        python3 setup.py sdist -d ~/rpmbuild/SOURCES/ --formats=gztar
        rpmbuild -ba ~/rpmbuild/SPECS/onboard.spec
    
    - name: Upload RPM packages
      uses: actions/upload-artifact@v4
      with:
        name: fedora-packages
        path: ~/rpmbuild/RPMS/*/*.rpm
        retention-days: 30

  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y flatpak flatpak-builder
    
    - name: Add Flathub remote
      run: |
        flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
    
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Build Flatpak
      run: |
        flatpak-builder --force-clean --repo=repo builddir packaging/flatpak/org.onboard.Onboard.yml
    
    - name: Create Flatpak bundle
      run: |
        flatpak build-bundle repo onboard.flatpak org.onboard.Onboard
    
    - name: Upload Flatpak bundle
      uses: actions/upload-artifact@v4
      with:
        name: flatpak-package
        path: onboard.flatpak
        retention-days: 30

  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    
    steps:
    - name: Install Snapcraft
      run: |
        sudo snap install snapcraft --classic
    
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Build Snap
      run: |
        cd packaging/snap
        snapcraft --destructive-mode
    
    - name: Upload Snap package
      uses: actions/upload-artifact@v4
      with:
        name: snap-package
        path: packaging/snap/*.snap
        retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-debian, build-fedora, build-flatpak, build-snap]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          debian-packages/*.deb
          fedora-packages/*.rpm
          flatpak-package/*.flatpak
          snap-package/*.snap
        draft: false
        prerelease: false
