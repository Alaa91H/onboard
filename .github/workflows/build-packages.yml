name: Build Packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: pip install flake8 pyyaml

    - name: Validate setup.py syntax
      run: python -m py_compile setup.py

    - name: Validate all Python files syntax
      run: |
        find . -name "*.py" -not -path "./.git/*" -not -path "./build/*" -not -path "./dist/*" -print0 | while IFS= read -r -d '' f; do
          if ! python -m py_compile "$f" 2>/dev/null; then
            echo "FAIL: $f"
          fi
        done

    - name: Check for critical Python errors
      run: |
        python -m flake8 setup.py --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Validate YAML files
      run: |
        python -c "
        import yaml, sys, os
        errors = []
        for root, dirs, files in os.walk('.'):
          dirs[:] = [d for d in dirs if d != '.git']
          for f in files:
            if f.endswith(('.yml', '.yaml')):
              path = os.path.join(root, f)
              try:
                with open(path) as fh:
                  yaml.safe_load(fh)
                print(f'OK: {path}')
              except Exception as e:
                errors.append(f'{path}: {e}')
                print(f'FAIL: {path}: {e}')
        if errors:
          sys.exit(1)
        "

    - name: Validate XML layout files
      run: |
        pip install lxml
        python -c "
        import xml.etree.ElementTree as ET
        import sys, os
        errors = []
        for f in os.listdir('layouts'):
          if f.endswith('.onboard'):
            path = os.path.join('layouts', f)
            try:
              ET.parse(path)
              print(f'OK: {path}')
            except ET.ParseError as e:
              errors.append(f'{path}: {e}')
              print(f'FAIL: {path}: {e}')
        if errors:
          sys.exit(1)
        "

    - name: Validate no dead Python imports
      run: |
        python -m flake8 setup.py scripts/ tools/ --select=F401 --ignore=F401,F811 --show-source --statistics 2>/dev/null || true

    - name: Check project structure integrity
      run: |
        echo "=== Checking required files ==="
        required_files=(
          "setup.py"
          "packaging/flatpak/org.onboard.Onboard.yml"
          "packaging/snap/snapcraft.yaml"
          "packaging/fedora/onboard.spec"
          "debian/control"
          "debian/rules"
        )
        for f in "${required_files[@]}"; do
          if [ -f "$f" ]; then
            echo "OK: $f"
          else
            echo "MISSING: $f"
          fi
        done
        echo "=== Checking layout files ==="
        layout_count=$(ls layouts/*.onboard 2>/dev/null | wc -l)
        echo "Layout files found: $layout_count"
        echo "=== Checking locale files ==="
        locale_count=$(ls po/*.po 2>/dev/null | wc -l)
        echo "Translation files found: $locale_count"

  build-debian:
    name: Build Debian/Ubuntu Packages
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    needs: [lint]
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y git build-essential python3-packaging python3-dev
        apt-get install -y dh-python python3-distutils-extra devscripts pkg-config
        apt-get install -y libgtk-3-dev libxtst-dev libxkbfile-dev libdconf-dev libcanberra-dev
        apt-get install -y libhunspell-dev libudev-dev python3-gi-cairo
        apt-get install -y debhelper dpkg-dev lintian
    
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Build packages
      run: dpkg-buildpackage -us -uc -b
    
    - name: Prepare artifacts
      run: |
        mkdir -p debs
        cp ../*.deb debs/ || true
    
    - name: Validate Debian packages
      run: |
        echo "=== All built packages ==="
        ls -la debs/*.deb 2>/dev/null || true
        for pkg in debs/*.deb; do
          if [ -f "$pkg" ]; then
            echo "--- $(basename $pkg) ---"
            dpkg-deb --info "$pkg" || true
          fi
        done
        echo "=== Lintian checks ==="
        for pkg in debs/*.deb; do
          if [ -f "$pkg" ]; then
            lintian "$pkg" --no-tag-display-limit 2>&1 | tail -20 || true
          fi
        done
    
    - name: Filter and rename release packages
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        mkdir -p release
        for f in debs/onboard-data_*.deb; do
          [ -f "$f" ] && cp "$f" "release/onboard-${VERSION}-debian-amd64.deb"
        done
        echo "=== Release Debian packages ==="
        ls -la release/
        for pkg in release/*.deb; do
          [ -f "$pkg" ] && dpkg-deb --info "$pkg" 2>/dev/null | grep -E "Package:|Version:|Architecture:|Installed-Size:" || true
        done
    
    - name: Upload Debian packages
      uses: actions/upload-artifact@v6
      with:
        name: debian-packages
        path: release/*.deb
        retention-days: 30

  build-fedora:
    name: Build Fedora RPM Packages
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: [lint]
    
    steps:
    - name: Install dependencies
      run: |
        dnf install -y git gcc-c++ python3-devel python3-setuptools
        dnf install -y python3-packaging python3-distutils-extra
        dnf install -y gtk3-devel libXtst-devel libxkbfile-devel dconf-devel
        dnf install -y libcanberra-devel hunspell-devel libudev-devel
        dnf install -y rpm-build intltool pkg-config desktop-file-utils
    
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Build RPM
      run: |
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        cp packaging/fedora/onboard.spec ~/rpmbuild/SPECS/
        tar czf ~/rpmbuild/SOURCES/onboard-1.4.4.tar.gz --transform="s,^\.,onboard-1.4.4," .
        rpmbuild -ba ~/rpmbuild/SPECS/onboard.spec
    
    - name: Validate RPM packages
      run: |
        echo "=== All built RPMs ==="
        find ~/rpmbuild/RPMS -name "*.rpm" -exec ls -la {} \;
        echo "=== RPM info ==="
        find ~/rpmbuild/RPMS -name "*.rpm" -exec rpm -qpi {} \;
    
    - name: Filter and rename release packages
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        mkdir -p release /tmp/rpms
        find ~/rpmbuild/RPMS -name "*.rpm" \
          ! -name "gnome-shell-extension-onboard-*" \
          ! -name "onboard-debuginfo-*" \
          ! -name "onboard-debugsource-*" \
          -exec cp {} /tmp/rpms/ \;
        for f in /tmp/rpms/onboard-[0-9]*.rpm; do
          [ -f "$f" ] && cp "$f" "release/onboard-${VERSION}-fedora-x86_64.rpm"
        done
        for f in /tmp/rpms/onboard-data-*.rpm; do
          [ -f "$f" ] && cp "$f" "release/onboard-data-${VERSION}-fedora-noarch.rpm"
        done
        echo "=== Release Fedora packages ==="
        ls -la release/
        for pkg in release/*.rpm; do
          [ -f "$pkg" ] && rpm -qpi "$pkg" 2>/dev/null | grep -E "Name:|Version:|Architecture:|Size:" || true
        done
    
    - name: Upload RPM packages
      uses: actions/upload-artifact@v6
      with:
        name: fedora-packages
        path: release/*.rpm
        retention-days: 30

  build-flatpak:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
    
    - name: Install Flatpak SDK
      run: |
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install -y --user flathub org.gnome.Platform//46 org.gnome.Sdk//46
    
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Build Flatpak
      run: |
        flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo builddir packaging/flatpak/org.onboard.Onboard.yml
    
    - name: Create and rename Flatpak bundle
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        flatpak build-bundle repo onboard.flatpak org.onboard.Onboard
        mv onboard.flatpak "onboard-${VERSION}-flatpak-x86_64.flatpak"
        echo "=== Release Flatpak package ==="
        ls -la onboard-*.flatpak
    
    - name: Upload Flatpak bundle
      uses: actions/upload-artifact@v6
      with:
        name: flatpak-package
        path: "onboard-*-flatpak-*.flatpak"
        retention-days: 30

  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
    - name: Install Snapcraft
      run: sudo snap install snapcraft --classic
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ pkg-config libgtk-3-dev libxtst-dev libxkbfile-dev
        sudo apt-get install -y libdconf-dev libcanberra-dev libhunspell-dev libudev-dev
        sudo apt-get install -y libwayland-dev libxkbcommon-dev python3-dev python3-cairo
        sudo apt-get install -y python3-gi python3-distutils-extra intltool libglib2.0-dev
    
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Build Snap
      run: |
        sudo mkdir -p snap
        sudo cp packaging/snap/snapcraft.yaml snap/
        sudo snapcraft --destructive-mode
    
    - name: Rename Snap package
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        for f in *.snap; do
          if [ -f "$f" ]; then
            sudo mv "$f" "onboard-${VERSION}-snap-amd64.snap"
          fi
        done
        echo "=== Release Snap package ==="
        ls -la onboard-*.snap
    
    - name: Upload Snap package
      uses: actions/upload-artifact@v6
      with:
        name: snap-package
        path: "onboard-*-snap-*.snap"
        retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-debian, build-fedora, build-flatpak, build-snap]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts
    
    - name: List release assets
      run: |
        echo "=== All release assets ==="
        find artifacts/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.flatpak" -o -name "*.snap" \) -exec ls -lh {} \;
    
    - name: Create Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: |
          artifacts/debian-packages/*.deb
          artifacts/fedora-packages/*.rpm
          artifacts/flatpak-package/*.flatpak
          artifacts/snap-package/*.snap
        draft: false
        prerelease: false
