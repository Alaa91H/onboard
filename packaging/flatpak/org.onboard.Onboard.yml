id: org.onboard.Onboard
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
command: onboard
rename-desktop-file: onboard.desktop
rename-icon: onboard
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.a11y.Bus
  - --talk-name=org.a11y.atspi.Registry
  - --filesystem=xdg-config/onboard
  - --filesystem=xdg-run/dconf
  - --talk-name=ca.desrt.dconf
modules:
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dsystemduserunitdir=/app/lib/systemd/user/
      - -Dbash_completion=false
      - -Dman=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/0.49/dconf-0.49.0.tar.xz
        sha256: 16a47e49a58156dbb96578e1708325299e4c19eea9be128d5bd12fd0963d6c36
  - name: onboard
    buildsystem: simple
    build-commands:
      - rustc --version
      - cargo --version
      - python3 setup.py build
      - python3 setup.py install --prefix=/app --skip-build
    sources:
      - type: dir
        path: ../..
