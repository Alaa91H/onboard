app-id: org.onboard.Onboard
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: onboard

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  - --socket=system-bus
  - --device=all
  - --env=XCURSOR_SIZE=64
  - --talk-name=org.a11y.atspi.Manager
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.gnome.Shell
  - --talk-name=org.gnome.desktop.a11y.keyboard
  - --talk-name=org.onboard.Onboard
  - --filesystem=xdg-run/dconf
  - --filesystem=xdg-config/dconf:ro
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /share/man
  - '*.pyo'
  - '*.pyc'

modules:
  - name: hunspell
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/hunspell/hunspell/archive/refs/tags/v1.7.2.tar.gz
        sha256: 69fa312d3586c988789266eaf7ffc9861d9f6396c31fc930a014d551b59bbd6e

  - name: libcanberra
    buildsystem: autotools
    config-opts:
      - --disable-oss
      - --disable-alsa
      - --disable-pulse
      - --enable-gtk
    sources:
      - type: archive
        url: https://sources.voidlinux.org/libcanberra-0.30/libcanberra-0.30.tar.xz
        sha256: c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72

  - name: onboard
    buildsystem: simple
    build-commands:
      - python3 setup.py clean
      - python3 setup.py build
      - python3 setup.py install --root=/app --prefix=/app
    sources:
      - type: git
        url: https://github.com/Alaa91H/onboard.git
        branch: main
    post-install:
      - glib-compile-schemas /app/share/glib-2.0/schemas/
      - gtk-update-icon-cache -q /app/share/icons/hicolor || true
      - update-desktop-database /app/share/applications || true

  - name: onboard-data
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/onboard/models
      - cp -r models/* /app/share/onboard/models/
      - mkdir -p /app/share/onboard/emojione
      - cp -r emojione/svg/* /app/share/onboard/emojione/
    sources:
      - type: git
        url: https://github.com/Alaa91H/onboard.git
        branch: main

  - name: gnome-shell-extension
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/gnome-shell/extensions/Onboard_Indicator@onboard.org
      - cp -r gnome/current/Onboard_Indicator@onboard.org/* /app/share/gnome-shell/extensions/Onboard_Indicator@onboard.org/
    sources:
      - type: git
        url: https://github.com/Alaa91H/onboard.git
        branch: main
    only-arches:
      - x86_64
      - aarch64
