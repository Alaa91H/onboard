id: org.onboard.Onboard
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: onboard
rename-desktop-file: onboard.desktop
rename-icon: onboard
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.a11y.Bus
  - --talk-name=org.a11y.atspi.Registry
  - --filesystem=xdg-config/onboard
modules:
  - name: onboard
    buildsystem: simple
    build-commands:
      - python3 setup.py build
      - python3 setup.py install --prefix=/app --skip-build
    sources:
      - type: dir
        path: ../..
