app-id: org.onboard.Onboard
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: onboard

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  - --socket=system-bus
  - --device=all
  - --env=XCURSOR_SIZE=64
  - --talk-name=org.a11y.atspi.Manager
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.gnome.Shell
  - --talk-name=org.gnome.desktop.a11y.keyboard
  - --talk-name=org.onboard.Onboard
  - --filesystem=xdg-run/dconf
  - --filesystem=xdg-config/dconf:ro
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /share/man
  - '*.pyo'
  - '*.pyc'

modules:
  - name: dconf
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/dconf.git
        tag: "0.40.0"

  - name: hunspell
    buildsystem: simple
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=/app --disable-static --disable-dependency-tracking
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: git
        url: https://github.com/hunspell/hunspell.git
        tag: v1.7.2

  - name: onboard
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.11/site-packages:/app/lib/python3/dist-packages
    build-commands:
      - cd tmp/distutils-extra && pip3 install --no-build-isolation --prefix=/app .
      - python3 setup.py clean
      - python3 setup.py build
      - python3 setup.py install --root=/app --prefix=/app
    sources:
      - type: git
        url: https://github.com/Alaa91H/onboard.git
        branch: main
      - type: git
        url: https://salsa.debian.org/python-team/modules/python-distutils-extra.git
        branch: master
        dest: tmp/distutils-extra
    post-install:
      - glib-compile-schemas /app/share/glib-2.0/schemas/
      - gtk-update-icon-cache -q /app/share/icons/hicolor || true
      - update-desktop-database /app/share/applications || true

  - name: onboard-data
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/onboard/models
      - cp -r models/* /app/share/onboard/models/
      - mkdir -p /app/share/onboard/emojione
      - cp -r emojione/svg/* /app/share/onboard/emojione/
    sources:
      - type: git
        url: https://github.com/Alaa91H/onboard.git
        branch: main

  - name: gnome-shell-extension
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/gnome-shell/extensions/Onboard_Indicator@onboard.org
      - cp -r gnome/current/Onboard_Indicator@onboard.org/* /app/share/gnome-shell/extensions/Onboard_Indicator@onboard.org/
    sources:
      - type: git
        url: https://github.com/Alaa91H/onboard.git
        branch: main
    only-arches:
      - x86_64
      - aarch64
