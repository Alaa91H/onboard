name: onboard
version: '1.4.4'
summary: On-screen keyboard for everyone
description: |
  Onboard is an on-screen keyboard useful for everybody that cannot use a
  hardware keyboard; for example TabletPC users, mobility impaired users, etc.
  It works out of the box without requiring manual configuration, automatically
  reading the keyboard layout from the X server.

grade: stable
confinement: strict
base: core24
platforms:
  amd64:
  arm64:

apps:
  onboard:
    command: usr/local/bin/onboard
    desktop: usr/local/share/applications/onboard.desktop
    extensions: [gnome]
    plugs:
      - x11
      - wayland
      - unity7
      - desktop
      - desktop-legacy
      - gsettings
      - opengl
      - audio-playback
      - network
      - network-bind
      - hardware-observe
      - process-control
      - screen-inhibit-control
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/usr/local/lib/python3/dist-packages
      GI_TYPELIB_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/girepository-1.0
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib

  onboard-settings:
    command: usr/local/bin/onboard-settings
    desktop: usr/local/share/applications/onboard-settings.desktop
    extensions: [gnome]
    plugs:
      - x11
      - wayland
      - unity7
      - desktop
      - desktop-legacy
      - gsettings
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/usr/local/lib/python3/dist-packages
      GI_TYPELIB_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/girepository-1.0
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib

parts:
  onboard:
    plugin: nil
    source: .
    build-packages:
      - gcc
      - g++
      - pkg-config
      - libgtk-3-dev
      - libxtst-dev
      - libxkbfile-dev
      - libdconf-dev
      - libcanberra-dev
      - libhunspell-dev
      - libudev-dev
      - libwayland-dev
      - libxkbcommon-dev
      - python3-dev
      - python3-cairo
      - python3-gi
      - python3-distutils-extra
      - python3-pip
      - python3-setuptools
      - python3-packaging
      - intltool
      - libglib2.0-dev
    stage-packages:
      - python3-gi
      - python3-cairo
      - python3-dbus
      - python3-gi-cairo
      - iso-codes
      - librsvg2-common
      - gir1.2-gdkpixbuf-2.0
      - gir1.2-glib-2.0
      - gir1.2-gtk-3.0
      - gir1.2-pango-1.0
      - gir1.2-ayatanaappindicator3-0.1
      - gir1.2-atspi-2.0
      - xdg-utils
    override-build: |
      export PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH
      python3 setup.py clean
      python3 setup.py build
      python3 setup.py install --root=$CRAFT_PART_INSTALL --prefix=/usr

  layouts:
    plugin: nil
    after: [onboard]
    override-prime: |
      # Create layout for GSettings schemas
      mkdir -p $CRAFT_PRIME/usr/share/glib-2.0/schemas
      # Create layout for icons
      mkdir -p $CRAFT_PRIME/usr/share/icons

  desktop-integration:
    plugin: nil
    after: [onboard]
    override-prime: |
      # Fix desktop file paths
      sed -i 's|/usr/bin/onboard|onboard|g' $CRAFT_PRIME/usr/local/share/applications/onboard.desktop || true
      sed -i 's|/usr/bin/onboard-settings|onboard-settings|g' $CRAFT_PRIME/usr/local/share/applications/onboard-settings.desktop || true


